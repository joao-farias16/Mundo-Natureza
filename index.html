<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mundo da Natureza</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <header class="banner">
        <img src="Img/Logo.png" alt="Logo Natureza" class="logo" />
        <nav class="nav-links">
            <a href="https://www.instagram.com/joao_fariasds/">Rede Social</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

<main class="conteudo">
  <section class="grid-container">
    <div class="card">🌳 Floresta Amazônica</div>
    <div class="card">🌊 Oceanos Profundos</div>
    <div class="card">🏔️ Montanhas Geladas</div>
    <div class="card">🔥 Vulcões Ativos</div>
  </section>

  <aside class="aside-info">
    <div class="curiosidade">Sabia que árvores se comunicam pelas raízes?</div>
    <div class="dica">Dica: Economize água ao escovar os dentes.</div>
  </aside>
</main>

<footer class="footer">
</footer>

<section class="formulario-contato" id="contato">
  <h2>Entre em Contato</h2>
  <form id="form">
    <input type="text" name="nome" placeholder="Nome completo" required />
    <input type="text" name="cpf" placeholder="CPF" />
    <input type="date" name="data_nasc" />
    <input type="email" name="email" placeholder="Email" required />
    <input type="tel" name="telefone" placeholder="Telefone" />
    <select name="assunto">
      <option value="">Selecione o assunto</option>
      <option value="dúvida">Dúvida</option>
      <option value="sugestão">Sugestão</option>
      <option value="elogio">Elogio</option>
    </select>
    <textarea name="mensagem" placeholder="Mensagem" required></textarea>
    <label>
      <input type="checkbox" name="termos" required />
      Aceito os termos
    </label>
    <button type="submit">Enviar</button>
  </form>
</section>
</body>
</html>
